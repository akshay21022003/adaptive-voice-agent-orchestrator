<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="760" fill="#f1f5f9"/>
  <rect width="960" height="60" fill="#ffffff"/>
  <line x1="0" y1="60" x2="960" y2="60" stroke="#e2e8f0"/>
  <rect x="32" y="18" width="24" height="24" rx="6" fill="#4f46e5"/>
  <text x="68" y="37" font-size="18" font-weight="700" fill="#0f172a">Language Tutor</text>
  <text x="300" y="37" font-size="14" fill="#64748b">New lesson</text>
  <text x="410" y="37" font-size="14" fill="#64748b">History</text>
  <circle cx="800" cy="30" r="14" fill="#c7d2fe"/>
  <text x="794" y="35" font-size="13" font-weight="700" fill="#3730a3">A</text>
  <text x="824" y="35" font-size="14" fill="#334155">Arun</text>
  <!-- title row -->
  <text x="160" y="106" font-size="22" font-weight="700" fill="#0f172a">Greetings and introductions</text>
  <rect x="640" y="86" width="160" height="28" rx="14" fill="#fef3c7"/>
  <text x="720" y="105" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">Spanish · A1 · In progress</text>
  <!-- lesson card -->
  <rect x="160" y="130" width="640" height="270" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="188" y="164" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="1">LESSON</text>
  <text x="188" y="192" font-size="16" font-weight="700" fill="#0f172a">Vocabulary</text>
  <text x="188" y="218" font-size="14" fill="#334155">•  Hola  →  Hello</text>
  <text x="188" y="240" font-size="14" fill="#334155">•  Buenos días  →  Good morning</text>
  <text x="188" y="262" font-size="14" fill="#334155">•  ¿Cómo estás?  →  How are you?</text>
  <text x="188" y="294" font-size="16" font-weight="700" fill="#0f172a">Grammar tip</text>
  <text x="188" y="318" font-size="14" fill="#334155">Spanish has formal (usted) and informal (tú) forms.</text>
  <text x="188" y="340" font-size="14" fill="#334155">Use "usted" with strangers or elders.</text>
  <text x="188" y="372" font-size="14" fill="#94a3b8">Rendered from markdown returned by the API</text>
  <!-- quiz card -->
  <rect x="160" y="420" width="640" height="130" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="188" y="454" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="1">QUIZ</text>
  <text x="188" y="482" font-size="14" fill="#1e1b4b">1. Translate to Spanish: "Good morning, how are you?"</text>
  <text x="188" y="508" font-size="14" fill="#1e1b4b">2. Complete the sentence: "___ días, señor López."</text>
  <!-- answer -->
  <text x="160" y="588" font-size="13" font-weight="600" fill="#334155">Your answers</text>
  <rect x="160" y="598" width="640" height="90" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="178" y="624" font-size="14" fill="#0f172a">1. Buenos días, ¿cómo estás?</text>
  <text x="178" y="646" font-size="14" fill="#0f172a">2. Buenos</text>
  <text x="784" y="680" font-size="12" fill="#94a3b8" text-anchor="end">52 characters</text>
  <rect x="640" y="702" width="160" height="40" rx="8" fill="#4f46e5"/>
  <text x="720" y="727" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Submit answers</text>
</svg>