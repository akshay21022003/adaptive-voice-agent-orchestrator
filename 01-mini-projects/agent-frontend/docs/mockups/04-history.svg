<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="560" fill="#f1f5f9"/>
  <rect width="960" height="60" fill="#ffffff"/>
  <line x1="0" y1="60" x2="960" y2="60" stroke="#e2e8f0"/>
  <rect x="32" y="18" width="24" height="24" rx="6" fill="#4f46e5"/>
  <text x="68" y="37" font-size="18" font-weight="700" fill="#0f172a">Language Tutor</text>
  <text x="300" y="37" font-size="14" fill="#64748b">New lesson</text>
  <text x="410" y="37" font-size="14" font-weight="600" fill="#4f46e5">History</text>
  <rect x="410" y="46" width="52" height="2" fill="#4f46e5"/>
  <circle cx="800" cy="30" r="14" fill="#c7d2fe"/>
  <text x="794" y="35" font-size="13" font-weight="700" fill="#3730a3">A</text>
  <text x="824" y="35" font-size="14" fill="#334155">Arun</text>
  <text x="160" y="110" font-size="22" font-weight="700" fill="#0f172a">Your lessons</text>
  <!-- row 1 -->
  <rect x="160" y="136" width="640" height="76" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="184" y="168" font-size="16" font-weight="600" fill="#0f172a">Ordering food at a restaurant</text>
  <text x="184" y="192" font-size="13" fill="#64748b">Today, 10:42</text>
  <rect x="660" y="156" width="110" height="28" rx="14" fill="#fef3c7"/>
  <text x="715" y="175" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">In progress</text>
  <!-- row 2 -->
  <rect x="160" y="224" width="640" height="76" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="184" y="256" font-size="16" font-weight="600" fill="#0f172a">Greetings and introductions</text>
  <text x="184" y="280" font-size="13" fill="#64748b">Yesterday, 18:05 · score 1 of 2</text>
  <rect x="660" y="244" width="110" height="28" rx="14" fill="#dcfce7"/>
  <text x="715" y="263" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">Completed</text>
  <!-- row 3 -->
  <rect x="160" y="312" width="640" height="76" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="184" y="344" font-size="16" font-weight="600" fill="#0f172a">Numbers 1 to 20</text>
  <text x="184" y="368" font-size="13" fill="#64748b">3 days ago · not started</text>
  <rect x="660" y="332" width="110" height="28" rx="14" fill="#e2e8f0"/>
  <text x="715" y="351" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Not started</text>
  <text x="480" y="440" font-size="13" fill="#94a3b8" text-anchor="middle">Each row opens that lesson. "Not started" rows let you retry the lesson generation.</text>
</svg>