  <!-- feedback -->
  <rect x="160" y="260" width="640" height="190" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="188" y="294" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="1">FEEDBACK</text>
  <text x="188" y="324" font-size="14" fill="#334155">Question 1 is correct. Your greeting and question form are natural.</text>
  <text x="188" y="350" font-size="14" fill="#334155">Question 2 needs "Buenos días": the sentence needs both words.</text>
  <text x="188" y="376" font-size="14" fill="#334155">Tip: "días" is plural, so the greeting is always "Buenos días".</text>
  <text x="188" y="412" font-size="14" fill="#334155">Next step: practise greetings for the afternoon and evening.</text>
  <!-- conversation toggle -->
  <rect x="160" y="470" width="640" height="52" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="188" y="502" font-size="14" font-weight="600" fill="#334155">Show full conversation (lesson, quiz, your answers)</text>
