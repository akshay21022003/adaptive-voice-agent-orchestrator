  <text x="160" y="106" font-size="22" font-weight="700" fill="#0f172a">Greetings and introductions</text>
  <rect x="660" y="86" width="140" height="28" rx="14" fill="#dcfce7"/>
  <text x="730" y="105" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">Spanish · A1 · Completed</text>
  <!-- score summary -->
  <rect x="160" y="130" width="640" height="110" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="188" y="164" font-size="12" font-weight="700" fill="#4f46e5" letter-spacing="1">YOUR RESULT</text>
  <text x="188" y="214" font-size="44" font-weight="700" fill="#0f172a">1 / 2</text>
  <rect x="400" y="170" width="170" height="52" rx="10" fill="#dcfce7"/>
  <text x="485" y="193" font-size="12" fill="#166534" text-anchor="middle">Correct</text>
  <text x="485" y="213" font-size="18" font-weight="700" fill="#166534" text-anchor="middle">1</text>
  <rect x="590" y="170" width="170" height="52" rx="10" fill="#fee2e2"/>
